<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}中医处方开具与审核管理系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { background-color: #f5f7fa; }
        .navbar-brand { font-weight: bold; color: #1a7f37 !important; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .stat-card .value { font-size: 2rem; font-weight: 700; }
        .masked { color: #999; font-family: monospace; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'stats:dashboard' %}">🌿 中医处方管理系统</a>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center">
            <span class="me-3 text-muted">{{ user.get_full_name }}（{{ user.username }}）</span>
            <a href="{% url 'stats:dashboard' %}" class="btn btn-sm btn-outline-success me-2">驾驶舱</a>
            <a href="{% url 'prescriptions:prescription_list' %}" class="btn btn-sm btn-outline-primary me-2">处方</a>
            <a href="{% url 'patients:patient_list' %}" class="btn btn-sm btn-outline-info me-2">患者</a>
            <a href="{% url 'reviews:workbench' %}" class="btn btn-sm btn-outline-warning me-2">审核</a>
            <a href="{% url 'reviews:notifications' %}" class="btn btn-sm btn-outline-secondary me-2">🔔 通知</a>
            <a href="{% url 'users:logout' %}" class="btn btn-sm btn-outline-danger">退出</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container-fluid mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
