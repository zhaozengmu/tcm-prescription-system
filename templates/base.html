<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}中医处方开具与审核管理系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --brand: #1a8a5c;
            --brand-dark: #126845;
            --brand-light: #eaf6ef;
            --brand-grad: linear-gradient(135deg, #27a06a, #1a8a5c);
        }
        body { background-color: #f0f4f2; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .navbar { background: linear-gradient(135deg, #06281e, #0c4534 50%, #126845) !important; border-bottom: none !important; }
        .navbar-brand { font-weight: 700; color: #fff !important; letter-spacing: 1px; }
        .navbar .nav-user { color: #cfe9db; }
        .navbar .btn-nav {
            color: #dff0e8; border: 1px solid rgba(255,255,255,.35); border-radius: 20px;
            font-size: 13px; padding: 4px 14px;
        }
        .navbar .btn-nav:hover { background: rgba(255,255,255,.15); color: #fff; }
        .navbar .btn-nav.active { background: rgba(255,255,255,.25); color: #fff; font-weight: 600; }
        .navbar .btn-danger-outline { color: #ffd7d7; border-color: rgba(255,120,120,.5); }
        .card { border: none; border-radius: 14px; box-shadow: 0 2px 10px rgba(18,104,69,.07); }
        .card-header { border-radius: 14px 14px 0 0 !important; }
        .stat-card { border-radius: 14px; padding: 18px 20px; color: #fff; }
        .stat-card .value { font-size: 2.1rem; font-weight: 700; line-height: 1.1; }
        .stat-card .label { font-size: 13px; opacity: .9; }
        .stat-card.green { background: var(--brand-grad); }
        .stat-card.teal { background: linear-gradient(135deg, #1aa6a0, #147d78); }
        .stat-card.orange { background: linear-gradient(135deg, #f0a13a, #d9811b); }
        .stat-card.red { background: linear-gradient(135deg, #e0555a, #c0392b); }
        .stat-card.blue { background: linear-gradient(135deg, #4a90d9, #2f6fb2); }
        .stat-card.purple { background: linear-gradient(135deg, #8a6fd8, #6b4fb8); }
        .btn-brand { background: var(--brand-grad); color: #fff; border: none; }
        .btn-brand:hover { background: var(--brand-dark); color: #fff; }
        .btn-outline-brand { color: var(--brand); border: 1px solid var(--brand); }
        .btn-outline-brand:hover { background: var(--brand); color: #fff; }
        .text-brand { color: var(--brand) !important; }
        .badge-status { border-radius: 20px; padding: 4px 12px; font-weight: 500; }
        .table thead th { background: var(--brand-light); color: var(--brand-dark); font-weight: 600; }
        .masked { color: #999; font-family: monospace; }
        .section-title { font-weight: 700; color: #1f2937; }
        .section-title::before { content: ""; display: inline-block; width: 4px; height: 18px; background: var(--brand-grad); border-radius: 2px; margin-right: 8px; vertical-align: -3px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'stats:dashboard' %}">
            <span style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;background:var(--brand-grad);border-radius:8px;margin-right:8px;">🌿</span>
            TCM-RMS 中医处方系统
        </a>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center flex-wrap gap-1">
            <span class="nav-user me-3 small">{{ user.get_full_name }}（{{ user.username }}）</span>
            <a href="{% url 'stats:dashboard' %}" class="btn btn-sm btn-nav">驾驶舱</a>
            <a href="{% url 'prescriptions:prescription_list' %}" class="btn btn-sm btn-nav">处方</a>
            <a href="{% url 'prescriptions:herb_list' %}" class="btn btn-sm btn-nav">药材字典</a>
            <a href="{% url 'patients:patient_list' %}" class="btn btn-sm btn-nav">患者</a>
            <a href="{% url 'reviews:workbench' %}" class="btn btn-sm btn-nav">审核</a>
            <a href="{% url 'reviews:notifications' %}" class="btn btn-sm btn-nav">🔔 通知</a>
            <a href="{% url 'users:logout' %}" class="btn btn-sm btn-nav btn-danger-outline">退出</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container-fluid mt-4 px-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
